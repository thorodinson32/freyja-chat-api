spring:
  application:
    name: freyja-chat-api
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
  profiles:
    active: default
server:
  port: 8080

openai:
  api-key: ${OPENAI_API_KEY:}
  stock-news:
    model: ${OPENAI_STOCK_NEWS_MODEL:gpt-5.6-luna}
    daily-limit: ${OPENAI_STOCK_NEWS_DAILY_LIMIT:6}
    monthly-limit: ${OPENAI_STOCK_NEWS_MONTHLY_LIMIT:120}
    manual-daily-limit: ${OPENAI_STOCK_NEWS_MANUAL_DAILY_LIMIT:2}
  card-strategy:
    model: ${OPENAI_CARD_STRATEGY_MODEL:gpt-5.6-luna}
    daily-limit: ${OPENAI_CARD_STRATEGY_DAILY_LIMIT:12}
    monthly-limit: ${OPENAI_CARD_STRATEGY_MONTHLY_LIMIT:30}

logging:
  level:
    root: INFO
    com.aesirlogic.freyjachat: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
